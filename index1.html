    <script>
function login() {
    let username = document.getElementById("username").value;
    let password = document.getElementById("password").value;

    let checkfunction = document.getElementById("toggleCheck").checked;

    switch(checkfunction) {
        case true:
            document.getElementById("instructions").innerHTML = "Enter your username and password to login.";
        break;

        case false:
            document.getElementById("instructions").innerHTML = "";
        break;
    }

    if (username === "admin" && password === "1234") {
        alert("You have successfully logged in.");
    } else {
        alert("Wrong username or password.");
    }
}
</script>
<body>

    <div class="container">

        <h2><b>Login</b></h2>
        <p id="instructions"></p>
            <input type="checkbox" id="toggleCheck"> Show Instructions<br><br>

            <input type="text" id="username" placeholder="Username"><br><br>
            <input type="password" id="password" placeholder="Password"><br><br>

    <button onclick="login()">Login</button>

</div>
